name: profilkes

# The whole stack:  docker compose up --build
#   db      Postgres 16 on 127.0.0.1:55432
#   loader  one-shot: applies the schema/views and loads the workbook
#   api     Fastify on 127.0.0.1:8787
#   web     Vite dashboard on 127.0.0.1:5173, /api proxied to the api service
#   verify  one-shot: runs the 12 invariant checks

services:
  db:
    image: postgres:16-alpine
    container_name: profilkes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: profilkes
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profilkes"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  loader:
    build:
      context: .
      dockerfile: docker/loader.Dockerfile
    image: profilkes-loader:local
    container_name: profilkes-loader
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/profilkes
    volumes:
      - ./:/app:ro
    command: ["python", "scripts/init_db.py"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: profilkes-api:local
    container_name: profilkes-api
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/profilkes
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      - "8787:8787"
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: profilkes-web:local
    container_name: profilkes-web
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      VITE_POLLING: 1
      # The dashboard talks to the API through the dev-server proxy.
      API_ORIGIN: http://api:8787
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  verify:
    image: postgres:16-alpine
    container_name: profilkes-verify
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts:/scripts:ro
    entrypoint:
      - sh
      - -c
      - psql "postgresql://postgres:postgres@db:5432/profilkes" -v ON_ERROR_STOP=1 -f /scripts/verify.sql
    restart: "no"

volumes:
  pg_data:
  api_node_modules:
  web_node_modules:
